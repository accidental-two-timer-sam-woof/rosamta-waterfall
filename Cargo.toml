[workspace]
members = ["rosamta", "rosamta-core", "rosamta-platform", "rosamta-testkit"]
default-members = ["rosamta"]
exclude = ["prototypes/pilot"]
resolver = "3"

[workspace.package]
version = "0.1.0-dev"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
rosamta-core = { path = "rosamta-core" }
rosamta-platform = { path = "rosamta-platform" }
rosamta-testkit = { path = "rosamta-testkit" }
clap = { version = "=4.6.7", features = ["derive"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tempfile = "=3.27.0"

[workspace.lints.clippy]
disallowed_methods = "deny"
disallowed_types = "deny"
