[workspace]
members = ["crates/cli", "crates/core", "crates/platform", "crates/testkit"]
default-members = ["crates/cli"]
exclude = ["prototypes/pilot"]
resolver = "3"

[workspace.package]
version = "0.1.0-dev"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
rosamta-core = { path = "crates/core" }
rosamta-platform = { path = "crates/platform" }
rosamta-testkit = { path = "crates/testkit" }
clap = { version = "=4.6.7", features = ["derive"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tempfile = "=3.27.0"
toml_edit = { version = "=0.25.19", features = ["serde"] }

[workspace.lints.clippy]
disallowed_methods = "deny"
disallowed_types = "deny"
